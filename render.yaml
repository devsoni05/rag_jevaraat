services:
  - type: web
    name: jevaraat-rag-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python create_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: jevaraat
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CHROMA_PERSIST_DIRECTORY
        value: chroma-db
      - key: CHROMA_COLLECTION_NAME
        value: jevaraat_products
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
